name: traceforge

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TRACEFORGE_DB_USER:?set TRACEFORGE_DB_USER in .env}
      POSTGRES_PASSWORD: ${TRACEFORGE_DB_PASSWORD:?set TRACEFORGE_DB_PASSWORD in .env}
      POSTGRES_DB: ${TRACEFORGE_DB_NAME:?set TRACEFORGE_DB_NAME in .env}
    ports:
      - "${TRACEFORGE_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
